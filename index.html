<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קורס אנימציה ב-AI | Ronig.ai</title>
    <meta name="description" content="קורס ליצירת סרטוני אנימציה ב-AI — הירשמו לרשימת ההמתנה">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green: #6B7F52;
            --green-light: #8a9e6e;
            --dark: #222222;
            --darker: #1a1a1a;
            --white: #ffffff;
            --muted: #999999;
            --border: rgba(107, 127, 82, 0.3);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--dark);
            color: var(--white);
            direction: rtl;
            text-align: right;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        header {
            padding: 1.25rem clamp(1.5rem, calc((100% - 1100px) / 2), 200px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--darker);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo img { height: 38px; width: auto; }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
            display: none;
        }

        .logo-text span { color: var(--green); }

        /* ── HERO ── */
        #hero {
            padding: 4rem 2rem 3rem;
            max-width: 860px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text { }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(107, 127, 82, 0.15);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.82rem;
            color: var(--green-light);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .hero-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(1.75rem, 3.5vw, 2.6rem);
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 1.25rem;
            color: var(--white);
        }

        h1 .highlight { color: var(--green); }

        .hero-sub {
            font-size: 1.05rem;
            line-height: 1.85;
            color: #cccccc;
            margin-bottom: 0.75rem;
            font-weight: 400;
        }

        .hero-note {
            font-size: 0.88rem;
            color: var(--green-light);
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .hero-image {
            position: relative;
        }

        .hero-image img {
            width: 100%;
            border-radius: 16px;
            display: block;
            object-fit: cover;
            aspect-ratio: 1/1;
        }

        /* ── WHAT YOU GET ── */
        #courses {
            background: var(--darker);
            padding: 3rem 2rem;
            max-width: 680px;
            margin: 0 auto;
            text-align: center;
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--green);
            margin-bottom: 1.25rem;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .course-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: border-color 0.3s;
        }

        .course-card:hover { border-color: var(--border); }

        .course-icon { font-size: 2rem; margin-bottom: 0.75rem; }

        .course-card p {
            font-size: 0.93rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--white);
        }

        /* ── FORM ── */
        #form-section {
            padding: 3rem 2rem 5rem;
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .form-sub {
            font-size: 0.92rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        .form-wrap {
            background: rgba(107,127,82,0.07);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem;
        }

        /* ── FOOTER ── */
        footer {
            padding: 2.5rem 2rem;
            background: var(--darker);
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }

        .footer-logo img { height: 30px; }

        footer p { color: var(--muted); font-size: 0.82rem; }

        /* ── ANIMATIONS ── */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.65s ease, transform 0.65s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            #hero {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 3rem 1.25rem 2rem;
            }

            .hero-text { text-align: center; }
            .hero-image { order: -1; max-width: 340px; margin: 0 auto; }

            .courses-grid { grid-template-columns: 1fr; }

            #reinforce, #courses { padding: 2.5rem 1.25rem; }

            #form-section { padding: 2.5rem 1.25rem 4rem; }

            .form-wrap { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
    <a href="#" class="logo">
        <img src="assets/logo.png" alt="Ronig.ai" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="logo-text">Ronig<span>.ai</span></span>
    </a>
</header>

<!-- ── HERO ── -->
<section id="hero">
    <div class="hero-text fade-in">
        <div class="hero-badge">בקרוב</div>
        <h1>
            קורס ליצירת סרטוני<br>
            אנימציה ב-<span class="highlight">AI</span><br>
            כמו שאני יוצרת
        </h1>
        <p class="hero-sub">
            אני מפרקת שלב אחרי שלב<br>
            סרטון אנימציה שהגיע למיליון צפיות
        </p>
        <p class="hero-note">בלי ניסיון קודם</p>
    </div>
    <div class="hero-image fade-in">
        <img src="assets/me2.png" alt="רוני גרין" onerror="this.style.background='rgba(107,127,82,0.15)'; this.style.minHeight='360px'">
    </div>
</section>

<!-- ── WHAT YOU GET ── -->
<section id="courses">
    <div class="fade-in">
        <p class="section-label">מה הולך להיות?</p>
        <div class="courses-grid">
            <div class="course-card">
                <div class="course-icon">🎬</div>
                <p>קורס אנימציה ב-AI</p>
            </div>
            <div class="course-card">
                <div class="course-icon">🎙️</div>
                <p>מיני קורס קריינות וליפסינק</p>
            </div>
        </div>
    </div>
</section>

<!-- ── FORM ── -->
<section id="form-section">
    <div class="fade-in">
        <div class="form-wrap">
            <script type='text/javascript' src='//form2.ravpage.co.il/b8a9fce53439eaa011772dcf653cd4456A0451F2' charset='UTF-8'></script>
        </div>
    </div>
</section>

<!-- ── FOOTER ── -->
<footer>
    <div class="footer-logo">
        <img src="assets/logo.png" alt="Ronig.ai" onerror="this.style.display='none'">
    </div>
    <p>© 2026 Ronig.ai · כל הזכויות שמורות</p>
</footer>

<script>
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>

</body>
</html>
